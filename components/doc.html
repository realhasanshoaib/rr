<!-- Document shell, sections, icons, terms, collapsibles — always included.
     The plain <style> layer is structural: layout, mechanics, and a neutral
     token contract every component styles against. Redefine the tokens (or the
     classes) to bring your own design system. The <style theme> layer is the
     bundled "rr" look (Chalk: warm paper, crisp structure, and direct
     controls) and ships only with `rr build --theme rr`. -->

<template name="doc" props="title lang=en">
<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{title}</title>
@@STYLES@@
</head>
<body>
@@SPRITE@@
<main>
<slot/>
</main>
@@SCRIPTS@@
</body>
</html>
</template>

<template name="header" props="kicker= title icon=doc">
<header class="doc-header">
  <div class="head-line">
    <h1><rr-icon name="{icon}"/> {title}</h1>
    <span class="kicker klabel">{kicker}</span>
  </div>
  <slot/>
</header>
</template>

<template name="toc">
<nav class="spine doc-spine" aria-label="Sections">
  <div class="spine-mark"><rr-icon name="compass"/> Map</div>
  <div class="spine-rail">
    <slot/>
  </div>
</nav>
</template>

<template name="toc-link" props="href label">
<a class="spine-tick" href="{href}"><span class="spine-lab">{label}</span></a>
</template>

<template name="section" props="id title icon">
<section id="{id}">
  <h2><rr-icon name="{icon}"/> {title}</h2>
  <slot/>
</section>
</template>

<template name="icon" props="name">
<svg class="icon"><use href="#i-{name}"/></svg>
</template>

<template name="term" props="def">
<span class="term" tabindex="0" role="button" aria-expanded="false" data-def="{def}"><slot/></span>
</template>

<template name="details" props="summary">
<details>
  <summary>{summary}</summary>
  <slot/>
</details>
</template>

<style>
:root {
  color-scheme: light dark;
  /* neutral token contract — redefine these to restyle every component */
  --paper: #f7f6f2; --paper-2: #f1f0eb; --surface: #ffffff; --surface-muted: #fbfaf7;
  --ink: #0c0e12; --ink-2: #555b65; --ink-3: #858a92; --line: #deddd7; --line-strong: #c9c8c2;
  --chalk-green: #80b879; --chalk-yellow: #d9b641; --chalk-blue: #55aac9; --chalk-pink: #d67b7b;
  --bg: var(--paper); --fg: var(--ink); --muted: var(--ink-2);
  --accent: #315f72; --focus: #74b7cf; --amber: #9a7314; --green: #4f8c4a; --red: #b94c4c;
  --wash-blue: #e6f3f8; --wash-yellow: #fdf2cf; --wash-green: #e8f1e4; --wash-pink: #f8e4e4;
  /* rhythm */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 56px; --s8: 88px;
  /* type scale */
  --t-display: 38px; --t-section: 24px; --t-sub: 18px; --t-body: 16px; --t-support: 14px; --t-chrome: 12px;
  /* voices — labels are chrome text (badges, kickers, table heads, rails) */
  --display: ui-sans-serif, system-ui, sans-serif;
  --text: ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --label: var(--text); --label-case: none; --label-track: 0;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 16px; --spine-w: 176px;
  --shadow-sm: 0 1px 2px rgba(12, 14, 18, .04), 0 6px 18px rgba(12, 14, 18, .05);
  --shadow-md: 0 2px 4px rgba(12, 14, 18, .05), 0 20px 50px rgba(12, 14, 18, .09);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #191917; --paper-2: #22211e; --surface: #2a2925; --surface-muted: #211f1c;
    --ink: #f6f4ee; --ink-2: #cfccc4; --ink-3: #a5a198; --line: #47443d; --line-strong: #625e55;
    --chalk-green: #9ccb92; --chalk-yellow: #e2c469; --chalk-blue: #79c7e0; --chalk-pink: #e98585;
    --accent: #9bd7ed; --focus: #8fd3e8; --amber: #e2c469; --green: #8fcb87; --red: #e98585;
    --wash-blue: #213943; --wash-yellow: #44391e; --wash-green: #263c25; --wash-pink: #472a2a;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased;
  font: 400 var(--t-body)/1.5 var(--text);
}
main { display: grid; grid-template-columns: minmax(22px, 1fr) minmax(0, 720px) minmax(22px, 1fr); padding: var(--s7) 0 var(--s8); row-gap: var(--s1); }
main > * { grid-column: 2; min-width: 0; }
.wide { grid-column: 1 / -1; width: min(1080px, calc(100% - 44px)); justify-self: center; }
h1 { font: 660 var(--t-display)/1.08 var(--display); letter-spacing: -.04em; margin: 0 0 var(--s3); }
h2 { font: 650 var(--t-section)/1.2 var(--text); margin: var(--s7) 0 var(--s3); padding-bottom: var(--s2); border-bottom: 1px solid var(--line); }
h3 { font: 650 var(--t-sub)/1.35 var(--text); margin: var(--s5) 0 var(--s2); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* voices ------------------------------------------------------------------ */
.klabel { font: 500 var(--t-support)/1.4 var(--label); letter-spacing: var(--label-track); text-transform: var(--label-case); color: var(--muted); white-space: nowrap; }
.kicker:empty { display: none; }
.caption { color: var(--muted); font-size: var(--t-support); line-height: 1.5; }

/* header ------------------------------------------------------------------ */
.doc-header { margin-bottom: var(--s2); }
.head-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--s1) var(--s2); }
.head-line h1 { margin: 0; }
.head-line .kicker { margin-left: auto; }

/* icons use a rounded outline that stays quieter than the adjacent label. */
.icon { width: 1.15em; height: 1.15em; vertical-align: -.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* the spine — signature rail (documents + decks share the visual base) ---- */
.spine {
  position: fixed; inset: 0 auto 0 0; width: var(--spine-w); z-index: 30;
  background: var(--surface-muted); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: var(--s2) 0;
}
.spine-mark { display: flex; align-items: center; gap: 6px; padding: var(--s1) var(--s3) var(--s3); font: 600 var(--t-chrome)/1.35 var(--label); letter-spacing: var(--label-track); text-transform: var(--label-case); color: var(--muted); }
.spine-mark .icon { width: 1.1em; height: 1.1em; }
.spine-rail { flex: 1; position: relative; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.spine-rail::before { content: ""; position: absolute; left: var(--s2); top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.spine-tick { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 0 var(--s2); padding: 8px var(--s2); border-radius: var(--radius-sm); color: var(--muted); text-decoration: none; text-align: left; }
.spine-tick::before { content: ""; flex: none; width: 9px; height: 2px; background: currentColor; }
.spine-lab { font: 500 var(--t-chrome)/1.3 var(--label); letter-spacing: var(--label-track); text-transform: var(--label-case); }
.spine-tick:hover { color: var(--fg); text-decoration: none; }
.spine-tick[aria-current="true"] { color: var(--accent); background: var(--wash-blue); }
.spine-tick[aria-current="true"]::before { width: 15px; }
.spine-tick[aria-current="true"]::after { content: ""; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
body:has(.doc-spine) main { padding-left: calc(var(--spine-w) + var(--s2)); }
section[id] { scroll-margin-top: var(--s3); }

@media (max-width: 900px) {
  .doc-spine {
    inset: 0 0 auto 0; width: auto; height: auto; flex-direction: row; align-items: center;
    gap: var(--s1); border-right: 0; border-bottom: 1px solid var(--line); padding: var(--s1) var(--s2); overflow-x: auto;
  }
  .doc-spine .spine-mark { padding: 0; }
  .doc-spine .spine-rail { flex-direction: row; gap: var(--s1); overflow: visible; }
  .doc-spine .spine-rail::before { display: none; }
  .doc-spine .spine-tick { padding: 4px 6px; }
  .doc-spine .spine-tick::before { display: none; }
  .doc-spine .spine-tick[aria-current="true"]::after { display: none; }
  body:has(.doc-spine) main { padding-left: 0; padding-top: var(--s7); }
  section[id] { scroll-margin-top: var(--s6); }
}

/* prose surfaces ---------------------------------------------------------- */
table { border-collapse: collapse; width: 100%; font-size: var(--t-support); margin: var(--s2) 0; }
th, td { border-bottom: 1px solid var(--line); padding: var(--s1) var(--s2); text-align: left; vertical-align: top; }
th { color: var(--muted); font: 500 var(--t-chrome)/1.4 var(--label); text-transform: var(--label-case); letter-spacing: var(--label-track); }
code, pre, kbd { font: 500 var(--t-support)/1.55 var(--mono); }
code, kbd { background: var(--surface-muted); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .05rem .3rem; }
pre { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); overflow-x: auto; }
pre code { background: none; border: 0; padding: 0; }
img { max-width: 100%; border-radius: var(--radius); }

/* terms — dotted, definitions land in the legend panel (wide) or inline --- */
.term { border-bottom: 1px dotted var(--muted); cursor: help; }
.term-hot { color: var(--accent); border-bottom-color: var(--accent); border-bottom-style: solid; }
.term-inline[hidden] { display: none; }
.term-inline { display: block; margin: var(--s2) 0; padding: var(--s2) var(--s3); border-left: 2px solid var(--accent); background: var(--wash-blue); border-radius: var(--radius-sm); font-size: var(--t-support); line-height: 1.5; color: var(--fg); }
.legend-panel { position: fixed; right: var(--s5); bottom: var(--s5); z-index: 40; width: min(300px, 34vw); background: var(--surface); border: 1px solid var(--line-strong); border-left: 2px solid var(--accent); border-radius: var(--radius); padding: var(--s3); box-shadow: var(--shadow-md); }
.legend-panel[hidden] { display: none; }
.legend-panel-word { display: block; font: 600 var(--t-support)/1.4 var(--label); letter-spacing: var(--label-track); text-transform: var(--label-case); color: var(--accent); }
.legend-panel-def { display: block; margin-top: 6px; font-size: var(--t-support); line-height: 1.5; color: var(--fg); }
@media (max-width: 900px) { .legend-panel { display: none !important; } }

details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); margin: var(--s3) 0; }
summary { cursor: pointer; color: var(--muted); font-size: var(--t-support); }
details[open] summary { margin-bottom: var(--s1); }
details.src summary { font: 500 var(--t-chrome)/1.4 var(--label); text-transform: var(--label-case); letter-spacing: var(--label-track); }
details.src pre { background: var(--bg); margin: .25rem 0 .5rem; }

button { min-height: 40px; font: 600 var(--t-support)/1.35 var(--text); color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; }
button:hover { border-color: var(--ink-3); }
button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--wash-blue); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:disabled:hover { border-color: var(--line); }
button.iconbtn { min-width: 36px; padding: 6px 10px; line-height: 1; }
input, select { min-height: 40px; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 6px 10px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

@media (pointer: coarse) {
  button, input, select { min-height: 44px; }
  button.iconbtn { min-width: 44px; }
}

@media (prefers-reduced-motion: no-preference) {
  .spine-tick::before, .term, .term-hot { transition: width .16s ease-out, color .16s ease-out, border-color .16s ease-out; }
  button { transition: border-color .16s ease-out, color .16s ease-out, background-color .16s ease-out; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<style theme>
/* rr theme — Chalk: warm paper, dark ink, and quiet semantic color */
:root {
  --paper: #f7f6f2; --paper-2: #f1f0eb; --surface: #ffffff; --surface-muted: #fbfaf7;
  --ink: #0c0e12; --ink-2: #555b65; --ink-3: #858a92; --line: #deddd7; --line-strong: #c9c8c2;
  --chalk-green: #80b879; --chalk-yellow: #d9b641; --chalk-blue: #55aac9; --chalk-pink: #d67b7b;
  --bg: var(--paper); --fg: var(--ink); --muted: var(--ink-2);
  --accent: #315f72; --focus: #74b7cf; --amber: #9a7314; --green: #4f8c4a; --red: #b94c4c;
  --wash-blue: #e6f3f8; --wash-yellow: #fdf2cf; --wash-green: #e8f1e4; --wash-pink: #f8e4e4;
  --t-display: 40px; --t-section: 24px; --t-sub: 18px; --t-body: 16px; --t-support: 14px; --t-chrome: 12px;
  --display: "Bricolage Grotesque", ui-sans-serif, sans-serif;
  --text: "Figtree", ui-sans-serif, system-ui, sans-serif;
  --mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --label: var(--text); --label-case: none; --label-track: 0;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #191917; --paper-2: #22211e; --surface: #2a2925; --surface-muted: #211f1c;
    --ink: #f6f4ee; --ink-2: #cfccc4; --ink-3: #a5a198; --line: #47443d; --line-strong: #625e55;
    --chalk-green: #9ccb92; --chalk-yellow: #e2c469; --chalk-blue: #79c7e0; --chalk-pink: #e98585;
    --accent: #9bd7ed; --focus: #8fd3e8; --amber: #e2c469; --green: #8fcb87; --red: #e98585;
    --wash-blue: #213943; --wash-yellow: #44391e; --wash-green: #263c25; --wash-pink: #472a2a;
  }
}
</style>

<script>
document.querySelectorAll("[data-fullscreen]").forEach((b) =>
  b.addEventListener("click", () =>
    document.fullscreenElement
      ? document.exitFullscreen()
      : document.querySelector(b.dataset.fullscreen).requestFullscreen()));

document.querySelectorAll("[data-toggle-pressed]").forEach((b) =>
  b.addEventListener("click", () =>
    b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"))));

// spine scroll-spy: one tick per section, a blue dot marks where you are
(() => {
  const spine = document.querySelector(".doc-spine");
  if (!spine) return;
  const ticks = [...spine.querySelectorAll(".spine-tick")];
  const map = new Map();      // section element -> tick
  const targets = [];         // sections in document order
  for (const t of ticks) {
    const id = (t.getAttribute("href") || "").replace(/^#/, "");
    const el = id && document.getElementById(id);
    if (el) { map.set(el, t); targets.push(el); }
  }
  if (!targets.length) return;
  const visible = new Set();
  const mark = (cur) => ticks.forEach((t) => t.setAttribute("aria-current", map.get(cur) === t ? "true" : "false"));
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) e.isIntersecting ? visible.add(e.target) : visible.delete(e.target);
    mark(targets.find((t) => visible.has(t)) || targets[0]);
  }, { rootMargin: "-15% 0px -70% 0px", threshold: 0 });
  targets.forEach((t) => io.observe(t));
  ticks.forEach((t) => t.addEventListener("click", () => {
    const el = document.getElementById((t.getAttribute("href") || "").replace(/^#/, ""));
    if (el) mark(el);
  }));
  mark(targets[0]);
})();

// terms: definitions surface in the legend panel (wide) or expand inline (narrow/touch)
(() => {
  const terms = [...document.querySelectorAll(".term[data-def]")];
  if (!terms.length) return;
  const panel = document.createElement("aside");
  panel.className = "legend-panel"; panel.hidden = true; panel.setAttribute("aria-live", "polite");
  panel.innerHTML = '<span class="legend-panel-word"></span><span class="legend-panel-def"></span>';
  document.body.append(panel);
  const wordEl = panel.querySelector(".legend-panel-word");
  const defEl = panel.querySelector(".legend-panel-def");
  const wide = matchMedia("(min-width: 901px) and (pointer: fine)");

  terms.forEach((t) => {
    const inline = document.createElement("span");
    inline.className = "term-inline"; inline.hidden = true; inline.textContent = t.dataset.def;
    t.after(inline);
    const open = () => { if (!wide.matches) return; wordEl.textContent = t.textContent.trim(); defEl.textContent = t.dataset.def; panel.hidden = false; t.classList.add("term-hot"); };
    const close = () => { if (!wide.matches) return; panel.hidden = true; t.classList.remove("term-hot"); };
    const toggle = () => {
      if (wide.matches) return;
      const openNow = inline.hidden;
      inline.hidden = !openNow;
      t.classList.toggle("term-hot", openNow);
      t.setAttribute("aria-expanded", String(openNow));
    };
    t.addEventListener("mouseenter", open);
    t.addEventListener("mouseleave", close);
    t.addEventListener("focus", open);
    t.addEventListener("blur", close);
    t.addEventListener("click", toggle);
    t.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !wide.matches) { e.preventDefault(); toggle(); } });
  });
})();
</script>
