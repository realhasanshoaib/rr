<!-- Badges, callouts, progress bars. Tones: accent | green | amber | red (empty = neutral). -->

<template name="badge" props="tone=">
<span class="badge {tone}"><slot/></span>
</template>

<template name="callout" props="tone=">
<div class="callout {tone}"><slot/></div>
</template>

<template name="progress" props="label pct n tone=">
<div class="progress-row">
  <span class="n label">{label}</span>
  <div class="progress"><i class="{tone}" style="width:{pct}%"></i></div>
  <span class="n">{n}</span>
</div>
</template>

<style>
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 2px; font: 600 var(--t-support)/1.5 var(--label);
  letter-spacing: var(--label-track); text-transform: var(--label-case); border: 1px solid var(--line); color: var(--muted);
}
.badge.accent { color: var(--accent); border-color: var(--accent); }
.badge.green  { color: var(--green);  border-color: var(--green); }
.badge.amber  { color: var(--amber);  border-color: var(--amber); }
.badge.red    { color: var(--red);    border-color: var(--red); }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface); border-radius: var(--radius); padding: var(--s2) var(--s3); margin: var(--s2) 0; }
.callout.amber { border-left-color: var(--amber); }
.callout.red   { border-left-color: var(--red); }
.progress { height: 4px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); }
.progress > i.accent { background: var(--accent); }
.progress > i.amber { background: var(--amber); }
.progress > i.red { background: var(--red); }
.progress-row { display: flex; align-items: center; gap: var(--s2); margin: var(--s1) 0; }
.progress-row .progress { flex: 1; }
.progress-row .n { font: 500 var(--t-support)/1.4 var(--label); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: var(--label-track); }
.progress-row .n.label { min-width: 8rem; }
</style>
