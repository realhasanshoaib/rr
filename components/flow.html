<!-- Journey strip, before/after panes, timeline phases. Pane labels ride the
     card footer (mono), so the content stays the first, largest line. -->

<template name="journey">
<div class="journey">
  <slot/>
</div>
</template>

<template name="stop" props="tone=">
<span class="stop {tone}"><slot/></span>
</template>

<template name="sep">
<span class="sep"><rr-icon name="arrow-right"/></span>
</template>

<template name="panes">
<div class="panes">
  <slot/>
</div>
</template>

<template name="before" props="label=Before">
<div class="pane before">
  <slot/>
  <span class="pane-label">{label}</span>
</div>
</template>

<template name="after" props="label=After">
<div class="pane after">
  <slot/>
  <span class="pane-label">{label}</span>
</div>
</template>

<template name="phases">
<ol class="phases">
  <slot/>
</ol>
</template>

<template name="phase" props="label caption state=">
<li class="{state}">{label}<span class="caption">{caption}</span></li>
</template>

<style>
.journey { display: flex; align-items: center; gap: var(--s1); flex-wrap: wrap; margin: var(--s2) 0; }
.journey .stop { border: 1px solid var(--line); background: var(--surface); border-radius: 2px; padding: 4px 12px; font: 500 var(--t-support)/1.4 var(--label); letter-spacing: var(--label-track); white-space: nowrap; }
.journey .stop.new { color: var(--accent); border-color: var(--accent); }
.journey .sep { color: var(--muted); flex: none; }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin: var(--s2) 0; }
@media (max-width: 640px) { .panes { grid-template-columns: 1fr; } }
.pane { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); display: flex; flex-direction: column; }
.pane-label { margin-top: var(--s2); font: 500 var(--t-support)/1.4 var(--label); letter-spacing: var(--label-track); text-transform: var(--label-case); color: var(--muted); }
.pane.before { border-style: dashed; }
.pane.after { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.pane.after .pane-label { color: var(--accent); }
ol.phases { display: flex; list-style: none; padding: 0; margin: var(--s3) 0; gap: var(--s1); }
ol.phases li { flex: 1; position: relative; padding-top: var(--s3); font-size: var(--t-support); color: var(--muted); min-width: 0; }
ol.phases li::before {
  content: ""; position: absolute; top: 0; left: 0; width: .8rem; height: .8rem;
  border-radius: 50%; border: 2px solid var(--line); background: var(--bg);
}
ol.phases li::after {
  content: ""; position: absolute; top: .45rem; left: 1.3rem; right: .1rem; height: 1px; background: var(--line);
}
ol.phases li:last-child::after { display: none; }
ol.phases li.done::before { background: var(--green); border-color: var(--green); }
ol.phases li.done::after { background: var(--green); }
ol.phases li.now { color: var(--fg); font-weight: 600; }
ol.phases li.now::before { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 25%, var(--bg)); }
ol.phases li .caption { display: block; font-weight: 400; }
</style>
