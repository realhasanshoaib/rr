<!-- Retrieval practice. Two flavors, both persist per document and copy their
     gaps out as agent-ready text:

     rr-recall / rr-flashcard — PREFERRED. Flip cards that ask before they tell.
       The question is the front (>=18px); the back holds the short answer and a
       one-line why. After flipping, self-mark Got it / Missed it. The mono
       RECALL - nn rides the card footer, never a header.

     rr-quiz / rr-question / rr-choice / rr-why — the multiple-choice self-check,
       kept for compatibility. Mark the right choice with correct="1". -->

<template name="recall" props="id title=Recall">
<section class="recall-set" data-recall="{id}">
  <div class="recall-head"><rr-icon name="flip"/> {title}</div>
  <div class="recall-grid"><slot/></div>
  <div class="recall-foot">
    <span class="recall-score" data-recall-score></span>
    <span class="grow"></span>
    <button type="button" data-recall-copy>Copy missed</button>
    <button type="button" data-recall-reset>Reset</button>
  </div>
</section>
</template>

<template name="flashcard" props="q a">
<div class="recall" data-recall-card>
  <button type="button" class="recall-flip" aria-pressed="false">
    <span class="recall-face front">
      <span class="recall-q">{q}</span>
      <span class="recall-cue">Recall · <span data-recall-no></span> — flip</span>
    </span>
    <span class="recall-face back">
      <span class="recall-a">{a}</span>
      <span class="recall-why"><slot/></span>
    </span>
  </button>
  <div class="recall-mark" hidden>
    <span class="recall-tag">Recall · <span data-recall-no></span></span>
    <span class="grow"></span>
    <button type="button" class="recall-self" data-recall-got>Got it</button>
    <button type="button" class="recall-self" data-recall-miss>Missed it</button>
  </div>
</div>
</template>

<template name="quiz" props="id title=Self-check">
<section class="quiz" data-quiz="{id}">
  <div class="quiz-head"><rr-icon name="puzzle"/> {title}</div>
  <slot/>
  <div class="quiz-foot">
    <span class="score" data-quiz-score></span>
    <span class="grow"></span>
    <button type="button" data-quiz-copy>Copy results</button>
    <button type="button" data-quiz-reset>Reset</button>
  </div>
</section>
</template>

<template name="question" props="q">
<div class="q" data-q data-qtext="{q}">
  <p class="qt">{q}</p>
  <slot/>
</div>
</template>

<template name="choice" props="correct=">
<button type="button" class="choice" data-correct="{correct}"><slot/></button>
</template>

<template name="why">
<div class="why" hidden><b>Why.</b> <slot/></div>
</template>

<style>
/* recall — flip cards -------------------------------------------------------*/
.recall-set { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); margin: var(--s3) 0; }
.recall-head { display: flex; align-items: center; gap: var(--s1); font: 600 var(--t-sub)/1.3 var(--mono); letter-spacing: .02em; color: var(--fg); margin-bottom: var(--s2); }
.recall-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--s2); }
.recall { display: flex; flex-direction: column; }
.recall-flip { display: grid; width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); cursor: pointer; }
.recall-flip:hover { border-color: var(--muted); }
.recall[data-flipped="true"] .recall-flip { border-color: var(--accent); }
.recall-face { grid-area: 1 / 1; min-width: 0; }
.recall-face.back { visibility: hidden; opacity: 0; }
.recall[data-flipped="true"] .recall-face.front { visibility: hidden; opacity: 0; }
.recall[data-flipped="true"] .recall-face.back { visibility: visible; opacity: 1; }
.recall-q, .recall-a { display: block; font: 600 var(--t-body)/1.5 var(--text); }
.recall-why { display: block; font-size: var(--t-support); line-height: 1.55; color: var(--muted); margin-top: var(--s1); }
.recall-cue { display: block; margin-top: var(--s2); font: 500 var(--t-support)/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.recall-mark { display: flex; align-items: center; gap: var(--s1); margin-top: var(--s1); }
.recall-mark[hidden] { display: none; }
.recall-tag { font: 500 var(--t-support)/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.recall-mark .grow { flex: 1; }
.recall-self { font: 500 var(--t-chrome)/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; background: var(--bg); text-transform: uppercase; letter-spacing: .05em; }
.recall-self:hover { color: var(--fg); border-color: var(--muted); }
.recall[data-mark="got"] [data-recall-got] { color: var(--green); border-color: var(--green); }
.recall[data-mark="miss"] [data-recall-miss] { color: var(--red); border-color: var(--red); }
.recall-foot { display: flex; gap: var(--s1); align-items: center; margin-top: var(--s2); }
.recall-foot .grow { flex: 1; }
.recall-score { font: 500 var(--t-chrome)/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* quiz — multiple choice ----------------------------------------------------*/
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); margin: var(--s3) 0; }
.quiz-head { display: flex; align-items: center; gap: var(--s1); font: 600 var(--t-sub)/1.3 var(--mono); letter-spacing: .02em; color: var(--fg); margin-bottom: var(--s1); }
.quiz .q { padding: var(--s1) 0; }
.quiz .q + .q { border-top: 1px solid var(--line); }
.quiz .qt { font: 600 var(--t-body)/1.5 var(--text); margin: .25rem 0 var(--s1); }
.quiz .choice { display: block; width: 100%; text-align: left; margin: 6px 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s1) var(--s2); font-size: var(--t-support); }
.quiz .q.answered .choice { cursor: default; }
.quiz .q.answered .choice:hover { border-color: var(--line); }
.quiz .choice.picked-right { border-color: var(--green); color: var(--green); }
.quiz .choice.picked-wrong { border-color: var(--red); color: var(--red); }
.quiz .q.answered .choice.is-correct { border-color: var(--green); }
.quiz .q.answered .choice:not(.is-correct):not(.picked-wrong) { opacity: .55; }
.quiz .why { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--bg); border-radius: var(--radius); padding: var(--s1) var(--s2); margin: var(--s1) 0; font-size: var(--t-support); }
.quiz-foot { display: flex; gap: var(--s1); align-items: center; margin-top: var(--s2); }
.quiz-foot .grow { flex: 1; }
.quiz-foot .score { font: 500 var(--t-chrome)/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: no-preference) {
  .recall-face { transition: opacity .15s ease-out; }
}
</style>

<script>
// recall — flip cards, self-marking, per-document persistence
(() => {
  const KEY = "rr-recall:" + location.pathname;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const store = load();
  const save = () => localStorage.setItem(KEY, JSON.stringify(store));

  document.querySelectorAll("[data-recall]").forEach((set) => {
    const results = (store[set.dataset.recall] ??= {});
    const cards = [...set.querySelectorAll("[data-recall-card]")];

    const score = () => {
      const done = Object.keys(results).length;
      const got = Object.values(results).filter((r) => r.got).length;
      set.querySelector("[data-recall-score]").textContent =
        done ? `${got}/${cards.length} got · ${done}/${cards.length} marked` : "";
    };

    cards.forEach((card, idx) => {
      const n = String(idx + 1).padStart(2, "0");
      card.querySelectorAll("[data-recall-no]").forEach((e) => (e.textContent = n));
      const flip = card.querySelector(".recall-flip");
      const mark = card.querySelector(".recall-mark");
      const q = card.querySelector(".recall-q")?.textContent.trim() || `Card ${idx + 1}`;
      const setFlipped = (on) => {
        card.dataset.flipped = String(on);
        flip.setAttribute("aria-pressed", String(on));
        mark.hidden = !on;
      };
      flip.addEventListener("click", () => setFlipped(card.dataset.flipped !== "true"));
      const record = (v) => { card.dataset.mark = v; results[idx] = { q, got: v === "got" }; save(); score(); };
      card.querySelector("[data-recall-got]").addEventListener("click", () => record("got"));
      card.querySelector("[data-recall-miss]").addEventListener("click", () => record("miss"));
      const saved = results[idx];
      if (saved) { setFlipped(true); card.dataset.mark = saved.got ? "got" : "miss"; }
    });
    score();

    set.querySelector("[data-recall-copy]").addEventListener("click", async (ev) => {
      const missed = Object.values(results).filter((r) => !r.got).map((r) => r.q);
      const text = missed.length
        ? [`Recall — missed cards (${document.title}):`, ...missed.map((m) => `- ${m}`)].join("\n")
        : `Recall — no missed cards in ${document.title}`;
      try { await navigator.clipboard.writeText(text); }
      catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      const b = ev.currentTarget, prev = b.textContent;
      b.textContent = "Copied — paste to the agent";
      setTimeout(() => { b.textContent = prev; }, 1600);
    });
    set.querySelector("[data-recall-reset]").addEventListener("click", () => {
      store[set.dataset.recall] = {}; save(); location.reload();
    });
  });
})();

// quiz — multiple choice, per-document persistence
(() => {
  const KEY = "rr-quiz:" + location.pathname;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const store = load();
  const save = () => localStorage.setItem(KEY, JSON.stringify(store));

  document.querySelectorAll("[data-quiz]").forEach((quiz) => {
    const results = (store[quiz.dataset.quiz] ??= {});
    const questions = [...quiz.querySelectorAll("[data-q]")];

    const answer = (q, btn, persist) => {
      const i = questions.indexOf(q);
      q.classList.add("answered");
      q.querySelectorAll(".choice").forEach((c) => { if (c.dataset.correct) c.classList.add("is-correct"); });
      btn.classList.add(btn.dataset.correct ? "picked-right" : "picked-wrong");
      const why = q.querySelector(".why");
      if (why) why.hidden = false;
      if (persist) { results[i] = { chose: btn.textContent.trim(), right: !!btn.dataset.correct }; save(); }
      score();
    };

    const score = () => {
      const done = Object.keys(results).length;
      const right = Object.values(results).filter((r) => r.right).length;
      quiz.querySelector("[data-quiz-score]").textContent =
        done ? `${right}/${questions.length} right · ${done}/${questions.length} answered` : "";
    };

    questions.forEach((q, i) => {
      q.querySelectorAll(".choice").forEach((btn) =>
        btn.addEventListener("click", () => { if (!q.classList.contains("answered")) answer(q, btn, true); }));
      const saved = results[i];
      if (saved) {
        const btn = [...q.querySelectorAll(".choice")].find((c) => c.textContent.trim() === saved.chose);
        if (btn) answer(q, btn, false);
      }
    });
    score();

    quiz.querySelector("[data-quiz-copy]").addEventListener("click", async (ev) => {
      const right = Object.values(results).filter((r) => r.right).length;
      const out = [`Quiz results — ${document.title}: ${right}/${questions.length}`];
      questions.forEach((q, i) => {
        const r = results[i];
        if (!r) { out.push(`— Q${i + 1} "${q.dataset.qtext}" — unanswered`); return; }
        if (r.right) { out.push(`✓ Q${i + 1} "${q.dataset.qtext}"`); return; }
        const correct = [...q.querySelectorAll(".choice")].find((c) => c.dataset.correct)?.textContent.trim();
        out.push(`✗ Q${i + 1} "${q.dataset.qtext}" — chose "${r.chose}", correct: "${correct}"`);
      });
      const text = out.join("\n");
      try { await navigator.clipboard.writeText(text); }
      catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      const b = ev.currentTarget, prev = b.textContent;
      b.textContent = "Copied — paste to the agent";
      setTimeout(() => { b.textContent = prev; }, 1600);
    });

    quiz.querySelector("[data-quiz-reset]").addEventListener("click", () => {
      store[quiz.dataset.quiz] = {}; save(); location.reload();
    });
  });
})();
</script>
