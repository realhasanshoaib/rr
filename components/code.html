<!-- Annotatable code exhibits. Markup is generated by the build's <rr-code>
     pre-pass; this file ships the styling and the annotation runtime.
     Annotations persist in localStorage per document and copy out as
     agent-ready text via the floating "Copy annotations" bar. -->

<style>
.rr-code { margin: var(--s2) 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.rr-code figcaption { display: flex; align-items: center; gap: var(--s1); padding: var(--s1) var(--s2); background: var(--surface); border-bottom: 1px solid var(--line); font: 500 var(--t-chrome)/1.4 var(--label); color: var(--muted); text-transform: var(--label-case); letter-spacing: var(--label-track); }
.rr-code figcaption code { background: none; border: 0; padding: 0; text-transform: none; }
.rr-code figcaption .grow { flex: 1; }
.rr-code figcaption .hint { text-transform: none; letter-spacing: 0; opacity: .8; }
.rr-code pre.shiki { margin: 0; border: 0; border-radius: 0; padding: var(--s1) 0; background: var(--surface) !important; overflow-x: auto; font: 400 var(--t-support)/1.55 var(--mono); }
@media (prefers-color-scheme: dark) {
  .rr-code pre.shiki, .rr-code pre.shiki span { color: var(--shiki-dark, inherit) !important; }
}
.rr-code .line { position: relative; display: inline-block; width: 100%; padding-right: var(--s2); cursor: pointer; }
.rr-code code { counter-reset: line var(--ln-start, 0); }
.rr-code .line::before { counter-increment: line; content: counter(line); display: inline-block; width: 2.6em; padding-right: .9em; text-align: right; color: var(--muted); opacity: .55; user-select: none; }
.rr-code .line:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.rr-code .line.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.rr-code .line.annotated::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--amber); }
.rr-code .ann-note, .rr-code .ann-editor {
  display: block; white-space: normal; margin: var(--s1) var(--s2) var(--s1) 3.5em; padding: var(--s1) var(--s2);
  background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: var(--radius);
  font: 400 var(--t-support)/1.5 var(--text);
}
.rr-code .ann-note { cursor: pointer; }
.rr-code .ann-note .meta { color: var(--muted); font: 500 var(--t-chrome)/1.4 var(--label); text-transform: var(--label-case); letter-spacing: var(--label-track); display: block; margin-bottom: .15rem; }
.rr-code .ann-editor textarea { width: 100%; min-height: 3.2em; resize: vertical; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s1) var(--s2); }
.rr-code .ann-editor .row { display: flex; gap: var(--s1); margin-top: .4rem; align-items: center; }
.rr-code .ann-editor .row .grow { flex: 1; }
.ann-bar {
  position: fixed; right: var(--s2); bottom: var(--s2); z-index: 30;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--s1); display: flex; gap: var(--s1); align-items: center;
}
.ann-bar[hidden] { display: none; }
</style>

<script>
(() => {
  const KEY = "rr-ann:" + location.pathname;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const store = load();
  const save = () => localStorage.setItem(KEY, JSON.stringify(store));
  const blocks = [...document.querySelectorAll("figure[data-code-id]")];
  if (!blocks.length) return;

  const bar = document.createElement("div");
  bar.className = "ann-bar";
  bar.hidden = true;
  bar.innerHTML = '<button type="button" class="primary" data-ann-copy></button><button type="button" data-ann-clear>Clear</button>';
  document.body.append(bar);
  const copyBtn = bar.querySelector("[data-ann-copy]");

  const anns = (b) => (store[b.dataset.codeId] ??= []);
  const lines = (b) => [...b.querySelectorAll(".line")];
  const lineNo = (b, el) => Number(b.dataset.start) + lines(b).indexOf(el);
  const total = () => blocks.reduce((t, b) => t + anns(b).length, 0);

  function render(b) {
    b.querySelectorAll(".ann-note, .ann-editor").forEach((n) => n.remove());
    lines(b).forEach((l) => l.classList.remove("annotated", "sel"));
    const ls = lines(b);
    for (const a of anns(b).slice().sort((x, y) => x.s - y.s)) {
      const startIdx = a.s - Number(b.dataset.start);
      const endIdx = a.e - Number(b.dataset.start);
      for (let i = startIdx; i <= endIdx && i < ls.length; i++) ls[i].classList.add("annotated");
      const note = document.createElement("span");
      note.className = "ann-note";
      note.innerHTML = `<span class="meta">L${a.s}${a.e > a.s ? "–" + a.e : ""} · click to edit</span>`;
      note.append(a.text);
      note.addEventListener("click", () => edit(b, a.s, a.e, a));
      ls[Math.min(endIdx, ls.length - 1)].after(note);
    }
    const n = total();
    bar.hidden = !n;
    copyBtn.textContent = `Copy ${n} annotation${n === 1 ? "" : "s"}`;
  }

  function edit(b, s, e, existing) {
    document.querySelectorAll(".ann-editor").forEach((x) => x.remove());
    render(b);
    const ls = lines(b);
    const startIdx = s - Number(b.dataset.start);
    const endIdx = e - Number(b.dataset.start);
    for (let i = startIdx; i <= endIdx && i < ls.length; i++) ls[i].classList.add("sel");
    const ed = document.createElement("span");
    ed.className = "ann-editor";
    ed.innerHTML = `<textarea placeholder="Note for L${s}${e > s ? "–" + e : ""} — will be copied for the agent"></textarea>
      <span class="row"><span class="grow"></span>
      ${existing ? '<button type="button" data-del>Delete</button>' : ""}
      <button type="button" data-cancel>Cancel</button>
      <button type="button" class="primary" data-save>Save</button></span>`;
    const ta = ed.querySelector("textarea");
    if (existing) ta.value = existing.text;
    ed.querySelector("[data-save]").addEventListener("click", () => {
      const text = ta.value.trim();
      if (existing) existing.text = text || existing.text;
      else if (text) anns(b).push({ s, e, text });
      if (existing && !text) drop(b, existing);
      save(); render(b);
    });
    ed.querySelector("[data-cancel]").addEventListener("click", () => render(b));
    ed.querySelector("[data-del]")?.addEventListener("click", () => { drop(b, existing); save(); render(b); });
    ta.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); ed.querySelector("[data-save]").click(); }
      if (ev.key === "Escape") render(b);
    });
    ls[Math.min(endIdx, ls.length - 1)].after(ed);
    ta.focus();
  }

  const drop = (b, a) => { store[b.dataset.codeId] = anns(b).filter((x) => x !== a); };

  let anchor = null; // { block, line } for shift-click ranges
  for (const b of blocks)
    b.addEventListener("click", (ev) => {
      const l = ev.target.closest(".line");
      if (!l || ev.target.closest(".ann-note, .ann-editor")) return;
      const n = lineNo(b, l);
      if (ev.shiftKey && anchor && anchor.block === b) {
        edit(b, Math.min(anchor.n, n), Math.max(anchor.n, n));
      } else {
        anchor = { block: b, n };
        edit(b, n, n);
      }
    });

  function exportText() {
    const out = [`Annotations — ${document.title}`];
    for (const b of blocks) {
      const ls = lines(b);
      for (const a of anns(b).slice().sort((x, y) => x.s - y.s)) {
        out.push("", `${b.dataset.file} L${a.s}${a.e > a.s ? "-" + a.e : ""}:`);
        for (let i = a.s - Number(b.dataset.start); i <= a.e - Number(b.dataset.start) && i < ls.length; i++)
          out.push(`> ${ls[i].textContent.replace(/\s+$/, "")}`);
        out.push(`note: ${a.text}`);
      }
    }
    return out.join("\n");
  }

  copyBtn.addEventListener("click", async () => {
    const text = exportText();
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.append(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    const prev = copyBtn.textContent;
    copyBtn.textContent = "Copied — paste to the agent";
    setTimeout(() => { copyBtn.textContent = prev; }, 1600);
  });
  bar.querySelector("[data-ann-clear]").addEventListener("click", () => {
    for (const b of blocks) store[b.dataset.codeId] = [];
    save(); blocks.forEach(render);
  });

  blocks.forEach(render);
})();
</script>
