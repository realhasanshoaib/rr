<!-- Scorecard: promised vs delivered, one row per spec promise. -->

<template name="scorecard">
<div class="scorecard">
  <div class="row head"><span>Promised (spec)</span><span>Delivered (debrief)</span><span>Verdict</span></div>
  <slot/>
</div>
</template>

<template name="score-row" props="promised delivered verdict tone">
<div class="row"><span>{promised}</span><span>{delivered}</span><span class="badge {tone}">{verdict}</span></div>
</template>

<style>
.scorecard { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: var(--s2) 0; }
.scorecard .row { display: grid; grid-template-columns: 1fr 1fr 7rem; gap: var(--s2); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); font-size: var(--t-support); align-items: start; }
.scorecard .row:last-child { border-bottom: none; }
.scorecard .row.head { background: var(--surface); padding-block: var(--s1); }
.scorecard .row.head span { color: var(--muted); font: 500 var(--t-chrome)/1.4 var(--label); text-transform: var(--label-case); letter-spacing: var(--label-track); }
.scorecard .row .badge { justify-self: start; }
@media (max-width: 640px) { .scorecard .row { grid-template-columns: 1fr; gap: 4px; } }
</style>
