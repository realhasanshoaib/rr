<!-- Cards, stat tiles, two-column layout. Tiles obey the descending column:
     the value is the first and largest line; the kind-label rides below it. -->

<template name="card">
<div class="card">
  <slot/>
</div>
</template>

<template name="tiles">
<div class="tiles">
  <slot/>
</div>
</template>

<template name="tile" props="icon label value caption tone=">
<div class="card tile">
  <div class="tile-v {tone}">{value}</div>
  <div class="tile-l"><rr-icon name="{icon}"/> {label}</div>
  <span class="caption">{caption}</span>
</div>
</template>

<template name="cols2">
<div class="cols2">
  <slot/>
</div>
</template>

<style>
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s2) var(--s3); margin: var(--s2) 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s2); margin: var(--s2) 0; }
.tiles .card { margin: 0; }
.tile { display: flex; flex-direction: column; }
.tile-v { font: 600 26px/1.15 var(--mono); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tile-v.accent { color: var(--accent); }
.tile-v.amber { color: var(--amber); }
.tile-v.green { color: var(--green); }
.tile-v.red { color: var(--red); }
.tile-l { font: 500 var(--t-support)/1.4 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.tile-l .icon { width: 1em; height: 1em; }
.tile .caption { margin-top: 2px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
@media (max-width: 640px) { .cols2 { grid-template-columns: 1fr; } }
</style>
